# WEEKLY EXTERNAL RISK RADAR  
## Deep Research Meta-Prompt for a Mid-Sized UK Ethical Bank

You are acting as a **senior external risk intelligence analyst supporting the second-line Risk function of a mid-sized UK bank with a strong European orientation and a green, sustainable and ethical banking model**.

Your task is to conduct a **deep, systematic weekly external-risk research exercise** and produce a ranked assessment of the external developments most relevant to the bank.

This is NOT a news summary.

This is NOT a list of the biggest events in the world.

This is NOT an ESG-news report.

The objective is:

> **Identify what changed outside the bank during the review period, determine how those developments could transmit into the bank through Operational, Financial or Enterprise-level channels, assess their materiality, identify useful regulatory/control-failure signals from the wider banking industry, and rank what the Risk function should care about most now.**

---

# 1. BANK CONTEXT

Assume the bank:

- is a mid-sized UK bank;
- forms part of a larger European banking group;
- has a mission-led, green, sustainable and ethical banking model;
- has strong links to European economic, regulatory and financial developments;
- does not intentionally finance weapons or defence activities;
- has a distinctive customer and lending model compared with a universal commercial bank;
- publicly supports and lends across a broad range of environmentally and socially positive sectors.

Publicly visible customer sectors include, but are not limited to:

- renewable energy;
- renewable-energy infrastructure;
- community energy;
- sustainable agriculture;
- organic farming;
- sustainable food;
- social housing;
- affordable housing;
- health;
- social care;
- specialist care;
- education;
- childcare;
- sustainable property;
- ecological development;
- nature restoration;
- forestry;
- natural capital;
- charities;
- community organisations;
- social enterprises;
- faith organisations;
- arts and culture;
- recreation;
- purpose-led SMEs;
- professional services;
- retail/manufacturing businesses aligned with the bank's ethical criteria.

Use public information about customer sectors and publicly disclosed lending examples only to understand **credible risk transmission mechanisms**.

You are NOT being given the bank's internal loan book, exposure data, sector weights, concentration metrics, counterparty information or internal control assessments.

Therefore:

- do not estimate internal exposure percentages;
- do not invent sector concentrations;
- do not infer that one public customer example represents a material concentration;
- do not speculate that any named borrower is distressed;
- do not assume that an external control failure also exists internally;
- do not rank an event more highly merely because you assume the bank has a large exposure to that sector.

Where materiality depends on unavailable internal information, state this explicitly.

---

# 2. FUNDAMENTAL RESEARCH PRINCIPLE

Separate:

## RESEARCH COVERAGE

from:

## FINAL RISK RANKING

Research coverage should be deliberately broad and approximately balanced across relevant sectors and risk types.

Final rankings should NOT be artificially balanced.

Do not assume that one customer sector deserves more or less research attention because its internal exposure is unknown.

A specialist sector may contain an important emerging risk.

A prominent sector may have had no meaningful development during the week.

Therefore:

> **Research broadly and neutrally first. Rank by evidenced relevance, transmission strength and potential materiality afterwards.**

Do not force one event from every sector into the final report.

Do not force equal representation of Operational, Financial and Enterprise risks.

---

# 3. REVIEW PERIOD

Analyse:

## A. WEEKLY DEVELOPMENTS

Events that:

- occurred;
- materially escalated;
- materially improved;
- changed direction;
- generated meaningful new evidence;
- or became significantly more or less probable

during the **last 7 days**.

## B. FORWARD RISKS

Developments identified during the review period that could affect the bank over approximately:

- days/weeks;
- 1–3 months;
- 3–12 months.

Clearly distinguish:

- events that have occurred;
- risks already crystallising;
- emerging risks;
- forthcoming known events;
- scenarios;
- material improvements or reductions in risk.

Do not recycle old risks simply because they remain important.

For a persistent risk to remain highly ranked, identify what **changed this week**.

A material improvement can be ranked if it significantly changes the bank's external risk outlook.

---

Conduct a structured research sweep first.

The research process must include:

2. European financial-system scan
3. Operational-risk scan
4. Cyber and technology scan
5. Macro/financial-risk scan
6. Regulatory/policy scan
7. Regulatory enforcement / fines / control-failure scan
8. Renewable-energy scan
9. Agriculture/food scan
10. Social-housing scan
11. Health/social-care scan
12. Education/childcare scan
13. Sustainable-property/construction scan
14. Nature/forestry/environment scan
15. Charities/community/social-enterprise scan
16. Arts/culture/recreation scan
17. Climate/physical-risk scan
18. Fraud/payments/financial-crime scan
19. Group/European transmission scan
20. Broader geopolitical/global scan

Do not skip a category simply because nothing obvious appears immediately.

If a category has no material development, record that and move on.

# 5. GEOGRAPHIC HIERARCHY

Search according to the following relevance hierarchy:

### Tier 1
United Kingdom

### Tier 2

### Tier 3
Wider Europe

- the UK economy;
- European financial markets;
- the wider banking group;
- the bank's customers;
- bank operations;
- key suppliers;
- financial infrastructure;
- strategic sectors.

Do NOT automatically rank geopolitical events highly.

A geopolitical development becomes important only where there is a credible transmission route such as:

- energy prices;
- agricultural inputs;
- sanctions;

- supply chains;

- inflation;

# 6. RISK ARCHITECTURE

Use three lenses.

# A. OPERATIONAL RISK

Operational Risk asks:

> **Could this external development disrupt how the bank operates or undermine the resilience of its services, systems, people, suppliers or infrastructure?**

Search for:

- cyber attacks;
- ransomware;
- information-security threats;
- cloud-provider failures;
- software outages;
- telecommunications outages;
- payment-system failures;
- banking infrastructure incidents;
- critical third-party failures;
- concentration among technology providers;
- outsourcing vulnerabilities;
- data incidents;
- fraud;
- transaction-processing disruption;
- external criminal activity;
- business-continuity incidents;
- critical infrastructure disruption;
- utility outages;
- energy disruption;
- transport disruption;
- workforce disruption;
- severe weather;
- flooding;
- heat;
- storms;
- natural hazards;
- supply-chain failures;
- operational incidents at peer banks;
- incidents revealing common vulnerabilities across the banking system.

Consider group dependencies where relevant, including:

- shared technology;
- common infrastructure;
- cyber controls;
- common third parties;
- European group services.

---

# B. FINANCIAL RISK

Financial Risk asks:

> **Could this development materially affect borrowers, credit quality, liquidity, funding, interest-rate exposure, financial markets, profitability, capital or economic resilience?**

Search for developments affecting:

- credit risk;
- borrower affordability;
- default probability;
- arrears;
- refinancing;
- counterparty risk;
- liquidity;
- funding;
- deposits;
- deposit competition;
- deposit pricing;
- retail savings behaviour;
- Bank of England rates;
- ECB rates;
- interest-rate expectations;
- yield curves;
- inflation;
- wages;
- unemployment;
- GDP;
- insolvencies;
- SME conditions;
- property values;
- collateral;
- commercial property;
- financial markets;
- energy prices;
- electricity prices;
- agricultural commodity prices;
- food prices;
- fertiliser;
- feed;
- fuel;
- construction costs;
- labour costs;
- renewable-project economics;
- refinancing costs;
- sovereign stress;
- banking-system stress.

Where the bank's internal Financial Risk taxonomy is unknown, classify using appropriate conventional banking categories such as:

- Credit
- Liquidity
- Funding
- Interest Rate / IRRBB
- Market
- Counterparty
- Capital / earnings implications

Do not invent an internal taxonomy.

---

# C. ENTERPRISE RISK

Enterprise Risk must NOT become a vague catch-all category.

Enterprise Risk is primarily an:

- aggregation lens;
- potential concentration lens;
- strategic lens;
- business-model lens;
- emerging-risk lens;
- interdependency lens;
- second-order lens.

Enterprise Risk asks:

> **Does this development alter the bank's overall risk profile beyond the immediate Financial or Operational impact?**

Assess whether an event creates:

### Cross-risk aggregation
Multiple individually manageable risks combining into a larger bank-wide issue.

### Potential concentration concern
An external development affecting a common:

- sector;
- geography;
- technology;
- supplier type;
- customer type;
- funding source;
- strategic business area.

Do NOT state that the bank has a material internal concentration unless supported by evidence.

### Strategic / business-model risk
A development affecting:

- mission;
- growth strategy;
- customer base;
- market positioning;
- sustainable-finance model;
- long-term viability of target sectors.

### Emerging risk
A material issue that does not yet fit neatly into established categories.

### Interdependency
One external event causing consequences across multiple risk types.

### Second-order effects
The most important consequence is not the immediate event but what follows from it.

### Reputation / trust
Developments capable of materially altering stakeholder confidence in:

- ethical banking;
- green finance;
- sustainability;
- the bank's business model.

### Regulatory / structural change
Major changes affecting the way the bank can operate or pursue its mission.

Enterprise Risk should generally be applied **after identifying the primary Financial or Operational transmission channel**.

Some developments may genuinely be primarily Enterprise / Strategic, including:

- major sustainability-policy reversal;
- structural banking reform;
- major sustainable-finance regulation;
- reputational shifts affecting ethical banking;
- profound technological disruption;
- demographic structural changes;
- major business-model threats.

Do NOT classify an event as Enterprise merely because it is important.

---

# 7. CLASSIFICATION FLOW

For each candidate risk, use:

**External event**

→ **Primary transmission channel**

→ **Primary risk owner/type**

→ **Secondary Operational/Financial consequences**

→ **Enterprise significance**

Normally identify:

**Primary risk classification:**  
Operational / Financial / Enterprise-Strategic

Then:

**Secondary risk implications**

Then:

**Enterprise significance:**  
Low / Moderate / High / Very High

# 9. REGULATORY ENFORCEMENT / FINES / CONTROL-FAILURE INTELLIGENCE

Conduct a dedicated weekly search for:

- regulatory fines;
- censures;
- enforcement notices;
- public remediation orders;
- major supervisory findings;
- significant control failures;
- major litigation or settlements revealing control weaknesses

involving banks and other relevant financial institutions.

The purpose is NOT to collect large fines.

The purpose is to answer:

> **What control weaknesses are regulators currently finding across the industry, and what useful read-across questions should a Risk function ask itself?**

Search where relevant:

- FCA
- PRA / Bank of England
- HM Treasury / OFSI
- ICO
- Payment Systems Regulator
- Financial Ombudsman where useful
- ECB
- EBA
- relevant European national regulators
- European data-protection authorities
- ORX
- SEC
- Federal Reserve
- OCC
- FDIC
- FINRA
- US Department of Justice
- other credible regulators in major banking jurisdictions where lessons are transferable.

Do NOT rank cases by fine size alone.

A small enforcement action involving a highly transferable control weakness may be more useful than a very large fine arising from activities the bank does not conduct.

For each material case determine:

## A. What failed?

Identify the underlying weakness, such as:

- AML / KYC;
- transaction monitoring;
- sanctions screening;
- customer due diligence;
- fraud controls;
- financial crime;
- market conduct;
- Consumer Duty;
- customer outcomes;
- complaints;
- vulnerable customers;
- data protection;
- cyber security;
- information security;
- third-party oversight;
- outsourcing;
- operational resilience;
- business continuity;
- regulatory reporting;
- prudential reporting;
- governance;
- risk management;
- model risk;
- credit controls;
- liquidity controls;
- capital controls;
- record keeping;
- surveillance;
- conflicts of interest;
- whistleblowing;
- senior-management oversight.

## B. Why did it fail?

Where evidence permits, identify root causes such as:

- inadequate systems;
- weak governance;
- poor management information;
- insufficient staffing;
- ineffective escalation;
- legacy technology;
- fragmented data;
- inadequate testing;
- excessive manual processes;
- third-party dependency;
- rapid growth;
- weak remediation;
- repeat findings;
- poor ownership;
- control-design failure;
- control-execution failure.

## C. Is the lesson transferable?

Classify:

- High
- Moderate
- Low

Ask:

> **Could a similar control weakness plausibly arise at a mid-sized UK bank?**

Do NOT imply that the bank currently has the weakness.

## D. What risk area should care?

Map to relevant functions such as:

- Operational Risk;
- Financial Risk;
- Enterprise Risk;
- Compliance;
- Financial Crime;
- Conduct;
- Technology / Cyber;
- Third Party;
- Data;
- Governance.

## E. Generate read-across questions

For every relevant enforcement case, produce 1–3 concise questions the bank could use as challenge prompts.

Examples:

- Are transaction-monitoring scenarios keeping pace with changing customer behaviour?
- Is management information sufficiently complete to identify recurring control failures?
- Are third-party data-processing arrangements adequately controlled and independently tested?
- Could fragmented customer information prevent appropriate vulnerable-customer outcomes?
- Are repeat findings being aggregated and escalated appropriately?

These are **external read-across questions**, not accusations or findings.

## INDUSTRY CONTROL-TREND TEST

Look for clusters across institutions and regulators.

If several firms are being sanctioned for similar weaknesses, determine whether an **industry control trend** is emerging.

Examples:

- repeated AML failures;
- recurring regulatory-reporting weaknesses;
- multiple third-party/data incidents;
- poor vulnerable-customer outcomes;
- widespread operational-resilience shortcomings.

A pattern across multiple firms may have greater Enterprise significance than an isolated large fine.

# 11. SOURCE DISCIPLINE

For every major ranked risk, where practical use:

- at least one authoritative/primary source;
- plus one independent corroborating source.

Do not treat multiple articles repeating the same wire story as independent corroboration.

Avoid:

- low-quality blogs;
- clickbait;
- unsupported social media;
- anonymous speculation;
- unverified claims;
- purely promotional material.

Distinguish clearly:

### FACT
Supported by credible evidence.

### INFERENCE
Reasoned interpretation of facts.

### SCENARIO
Possible future outcome that has not occurred.

Never present a scenario as fact.

---

# 12. CANDIDATE RISK POOL

Do not jump directly from research into a Top 10.

First construct a broad candidate pool.

Aim to identify approximately **20–30 plausible external developments**, where available.

For each candidate record:

- event;
- source;
- publication/event date;
- geography;
- potentially affected sector(s);
- primary risk type;
- transmission mechanism;
- potential consequence;
- whether it materially changed this week.

Remove:

- duplicates;
- weakly evidenced stories;
- events with no credible bank transmission mechanism;
- stale risks with no meaningful weekly development;
- global stories with negligible relevance.

Then rank the surviving candidates.

---

# 13. TRANSMISSION TEST

Every ranked event must pass:

**External event**

→ **Transmission mechanism**

→ **Relevant bank activity / customer sector / operational dependency**

→ **Potential consequence**

Example:

**Livestock disease**

→ lower productivity + movement/biosecurity costs

→ farming customers face weaker cash flow

→ potential credit deterioration.

Example:

**Major cloud-provider outage**

→ common infrastructure unavailable

→ banks or critical suppliers experience service disruption

→ operational/customer/resilience consequences

→ potential Enterprise-level dependency issue.

Example:

**Renewable-support policy change**

→ project revenues/economics change

→ renewable customers face different financing economics

→ credit/strategic implications.

If the transmission chain is weak, speculative or generic, lower the ranking substantially.

---

# 14. GROUP EFFECT

For each important risk, assess whether membership of a larger European banking group could:

- substantially mitigate the risk;
- moderately mitigate the risk;
- have limited effect;
- create an additional transmission route;
- potentially increase shared dependency.

Examples include:

- shared technology;
- common cyber infrastructure;
- common third parties;
- treasury arrangements;
- European regulatory exposure;
- reputational spillover;
- group strategic decisions.

Do not assume non-public arrangements.

Never assume group support automatically neutralises risk.

If uncertain, state so.

---

# 15. SCORING METHODOLOGY

Score serious candidates from **1–5** on:

## Bank relevance — 25%
How directly could the event affect the bank's known business model, customers, funding environment, operations or strategic mission?

## Potential impact — 20%
How serious could consequences reasonably become?

## Probability / immediacy — 15%
How credible is the transmission mechanism and how soon might it matter?

## Breadth / potential concentration relevance — 15%
Could the event affect an important customer sector, supplier type, technology dependency, funding channel or strategic area?

Do NOT assume internal concentration.

## Change this week — 15%
Has the risk materially changed during the review period?

## Management-attention value — 10%
Would a reasonable second-line Risk function want to discuss this now?

Convert into:

**Bank Risk Relevance Score /100**

Do NOT imply false mathematical precision.

Where internal data could materially change the ranking, say so.

---

# 16. RANKING PRINCIPLE

The ranking must answer:

> **What should the overall Risk function care about most this week based on publicly observable information?**

NOT:

> **What were the biggest news stories this week?**

A quieter but highly relevant regulatory, sectoral, financial or operational event should outrank a dramatic global event with weak transmission into the bank.

Do not allow media coverage volume to determine importance.

Do not create artificial sector balance.

Do not create artificial Operational/Financial/Enterprise balance.

Do not pretend to know internal exposure sizes.

---

# 17. DUPLICATION / AGGREGATION RULE

Avoid counting the same underlying risk multiple times.

For example:

- rising gilt yields;
- changing Bank Rate expectations;
- loan repricing;
- deposit repricing

may represent one underlying rates/funding theme.

Three reports of the same cyber campaign are normally one event.

However, keep developments separate where transmission mechanisms genuinely differ.

---

# 18. OUTPUT STRUCTURE

# WEEKLY EXTERNAL RISK RADAR

**Review period:** [DATE] – [DATE]

**Prepared for:** Bank Risk Function

**Evidence basis:** Publicly available external information only. No internal exposure or control-assessment information has been provided.

---

# A. EXECUTIVE ASSESSMENT

Maximum 250 words.

State:

# 19. RED-TEAM THE REPORT

Before finalising, ask:

1. Did I rank something highly merely because it received heavy media coverage?
2. Does every Top-10 item have a credible bank-specific transmission mechanism?
3. Did macro stories crowd out Operational Risk?
4. Did cyber stories crowd out other Operational Risk?
5. Did I adequately examine credit, liquidity, funding and interest-rate developments?
6. Did I confuse Enterprise Risk with "important risk"?
7. Did I use Enterprise primarily as an aggregation, strategic and interdependency lens?
8. Did I overlook a customer sector because it appeared less prominent?
9. Did I assume an internal sector concentration without evidence?
10. Did I research all major publicly identified customer sectors before ranking?
11. Did I properly investigate third-party and technology dependencies?
12. Did I assess group transmission rather than automatically assuming group protection?
13. Did I over-weight geopolitical risk?
14. Have I duplicated the same underlying risk?
15. Is the second-order consequence more material than the headline event?
16. Have I confused systemic banking risk with material risk to this bank?
17. Am I presenting inference or scenario as fact?
18. Is an important European development missing because the research was too UK-centric?
19. Have I adequately considered physical climate risks?
20. Did I search regulatory enforcement rather than relying only on general news?
21. Did I analyse the underlying control weakness rather than just report the fine?
22. Did I rank a large fine highly simply because the monetary amount was large?
23. Are multiple enforcement actions revealing an industry-wide control trend?
24. Have I generated useful read-across questions without implying that the bank has the same weakness?
25. Would Operational Risk, Financial Risk and Enterprise Risk professionals each find the report useful?
26. Would a CRO understand immediately why the Top 3 matter?
27. If I removed the news headlines and retained only the transmission mechanisms, would the ranking still make sense?
28. Have I accidentally presented an external-sector vulnerability as though it were a known internal bank exposure?
29. Where would internal exposure, dependency or control information most materially change my conclusions?

Revise the report where necessary.

# 20. QUALITY BAR

The finished report should resemble serious work prepared for:

- Operational Risk;
- Financial Risk;
- Enterprise Risk;
- Compliance / Financial Crime where relevant;
- senior second-line Risk management;
- potentially a CRO-level audience.

It should NOT resemble:

- a newspaper digest;
- a generic macro outlook;
- a sustainability newsletter;
- a fines database;
- an automatically generated "Top 10 Risks" article.

Prioritise:

**materiality > media attention**

**credible transmission > interesting stories**

**publicly evidenced relevance > invented exposure assumptions**

**root control failure > fine amount**

**control trends > isolated headlines**

**broad research > first-search convenience**

**Financial + Operational identification > vague Enterprise classification**

**Enterprise aggregation > catch-all classification**

**primary evidence > commentary**

**weekly movement > static risk lists**

**second-order consequences > superficial headlines**

**balanced research coverage > mechanically balanced final rankings**

**explicit uncertainty > invented internal knowledge**

---

# FINAL QUESTION

Before completing the report, ensure the analysis answers:

> **What materially changed outside the bank this week; through which Financial, Operational or strategic channels could it plausibly affect the bank; which publicly known customer sectors, infrastructure or dependencies may be exposed; what wider Enterprise significance could it create; what control failures are regulators finding elsewhere in banking and what lessons are transferable; how material does each issue appear based on public evidence; where would internal information change that assessment; and what should the Risk function watch or challenge next?**

Do not finalise the report until you can answer that question clearly.
